# Site nginx trên MÁY CHỦ (không phải trong container). server-setup.sh thay
# __DOMAIN__ rồi cài vào /etc/nginx/sites-available; certbot thêm khối 443.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Ảnh ý tưởng / nền tải lên (app giới hạn 20MB mỗi file).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        # Gradio dùng websocket/SSE cho hàng đợi và trả kết quả theo lô.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Một lô 10 màu + sinh ảnh có thể chạy vài phút.
        proxy_read_timeout 600s;
    }
}
